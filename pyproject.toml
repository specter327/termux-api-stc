[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "termux-api-stc"
dynamic = ["version"]
description = "Strict Python consumer of the pinned official Termux:API command interface"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = ["termux", "android", "termux-api", "python"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Operating System :: Android",
  "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/specter327/termux-api-stc"
Repository = "https://github.com/specter327/termux-api-stc"
Issues = "https://github.com/specter327/termux-api-stc/issues"

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.setuptools.dynamic]
version = {attr = "termux_api_stc._version.__version__"}

[tool.setuptools.packages.find]
include = ["termux_api_stc*"]

[tool.pytest.ini_options]
addopts = "--strict-markers"
asyncio_mode = "auto"
testpaths = ["tests/unit-test", "tests/device"]
markers = [
  "device: requires a real Termux/Android environment",
  "conformance: compares library behavior against real Termux command behavior",
  "interactive: requires human/device interaction",
  "side_effect: changes device state or sends/creates something",
  "reversible: side effect with automatic restoration or temporary artifact cleanup",
  "sensitive: stateful, hardware-specific, or external communication action requiring explicit operator opt-in",
]
