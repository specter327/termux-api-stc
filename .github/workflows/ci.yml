name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[test]'
      - run: ./tests/run-tests.sh

  package:
    name: Build and metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Isolated wheel import smoke
        shell: bash
        run: |
          python -m venv /tmp/stc-wheel
          /tmp/stc-wheel/bin/python -m pip install --no-deps dist/*.whl
          cd /tmp
          /tmp/stc-wheel/bin/python - <<'PY'
          import pathlib
          import termux_api_stc
          print(termux_api_stc.__version__)
          print(termux_api_stc.__file__)
          assert 'site-packages' in termux_api_stc.__file__
          PY
